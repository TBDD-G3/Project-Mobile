name: project_mobile
description: "Expense Tracker — Ứng dụng quản lý chi tiêu cá nhân (Firebase + Riverpod)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Cloud Database & Authentication (Firebase — Câu 7)
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Data Visualization (for Member 3 Analytics)
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
